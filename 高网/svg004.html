<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src="https://at.alicdn.com/t/c/font_5238933_31mvpa8y8h9.js"></script>
    <link rel="stylesheet" href="./svg004.css">
</head>
<body>
   <h2>SVG图标</h2>
<div class="tab-nav">
    <div class="tab-item active" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-browser"></use>
        </svg>
        <span>浏览器</span>
    </div>
    <div class="tab-item" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-list"></use>
        </svg>
        <span>列表</span>
    </div>
    <div class="tab-item" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-filter"></use>
        </svg>
        <span>过滤</span>
    </div>
    <div class="tab-item" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-nav"></use>
        </svg>
        <span>导航</span>
    </div>
    <div class="tab-item" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-save"></use>
        </svg>
        <span>保存</span>
    </div>
    <div class="tab-item" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-close"></use>
        </svg>
        <span>关闭</span>
    </div>
    <div class="tab-item" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-bofang"></use>
        </svg>
        <span>播放</span>
    </div>
</div>
<script>
    function changeTab(current) {
        var items = document.querySelectorAll('.tab-item');
        for (var i = 0; i < items.length; i++) {
            items[i].classList.remove('active');
        }
        current.classList.add('active');
    }
    </script>
</body>
</html>
