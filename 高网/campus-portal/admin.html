<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台管理 - 东软校园信息服务平台</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <div class="brand">
          <span class="brand-badge">DS</span>
          <div class="brand-copy">
            <strong>东软校园</strong>
            <small>信息服务平台</small>
          </div>
        </div>
        <button class="nav-toggle" aria-label="主导航">☰</button>
        <nav class="site-nav" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="news.html">校园新闻</a>
          <a href="courses.html">课程平台</a>
          <a href="profile.html">个人中心</a>
          <a class="active" href="admin.html">后台管理</a>
          <a href="about.html">关于</a>
        </nav>
        <div class="nav-actions">
          <button class="icon-button" data-theme-toggle aria-label="切换主题">☾</button>
          <a href="login.html" class="btn btn-primary">登录</a>
        </div>
      </div>
    </header>

    <main class="container page">
      <div class="page-header">
        <h1>后台管理</h1>
      </div>

      <div class="admin-grid" id="adminCards"></div>

      <section class="panel" style="margin-top: 24px;">
        <div class="section-head">
          <h2>本周访问趋势</h2>
        </div>
        <div class="chart-bars" id="adminChart"></div>
      </section>

      <section class="panel" style="margin-top: 24px;">
        <div class="section-head">
          <h2>运营任务</h2>
          <button class="btn btn-secondary">新增任务</button>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>项目名称</th>
                <th>状态</th>
                <th>更新说明</th>
              </tr>
            </thead>
            <tbody id="adminTable"></tbody>
          </table>
        </div>
      </section>
    </main>

    <button class="back-to-top" aria-label="返回顶部">↑</button>

    <script src="assets/mock-data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
