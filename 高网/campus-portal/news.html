<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校园新闻 - 东软校园信息服务平台</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <div class="brand">
          <span class="brand-badge">DS</span>
          <div class="brand-copy">
            <strong>东软校园</strong>
            <small>信息服务平台</small>
          </div>
        </div>
        <button class="nav-toggle" aria-label="主导航">☰</button>
        <nav class="site-nav" aria-label="主导航">
          <a href="index.html">首页</a>
          <a class="active" href="news.html">校园新闻</a>
          <a href="courses.html">课程平台</a>
          <a href="profile.html">个人中心</a>
          <a href="admin.html">后台管理</a>
          <a href="about.html">关于</a>
        </nav>
        <div class="nav-actions">
          <button class="icon-button" data-theme-toggle aria-label="切换主题">☾</button>
          <a href="login.html" class="btn btn-primary">登录</a>
        </div>
      </div>
    </header>

    <main class="container page">
      <div class="page-header">
        <h1>校园新闻</h1>
      </div>

      <div class="filter-bar" aria-label="分类筛选">
        <button class="tab-btn active" data-tab="all">全部</button>
        <button class="tab-btn" data-tab="要闻">要闻</button>
        <button class="tab-btn" data-tab="通知">通知</button>
        <button class="tab-btn" data-tab="活动">活动</button>
        <button class="tab-btn" data-tab="公告">公告</button>
      </div>

      <div class="content-grid">
        <div class="panel">
          <div class="news-list" id="newsGrid"></div>
        </div>

        <aside class="side-stack">
          <div class="side-card">
            <h3>新闻排行</h3>
            <ul>
              <li class="focus-item"><span>创新实践成果广播</span><span class="tag primary">1</span></li>
              <li class="focus-item"><span>就业指导周直播</span><span class="tag warning">2</span></li>
              <li class="focus-item"><span>新学期课程安排</span><span class="tag success">3</span></li>
            </ul>
          </div>
          <div class="side-card">
            <h3>栏目说明</h3>
            <p class="page-note">聚合学校动态、教师科研、学生事务和校园活动等信息，便于快速获取关键信息与最新公告。</p>
          </div>
        </aside>
      </div>
    </main>

    <button class="back-to-top" aria-label="返回顶部">↑</button>

    <script src="assets/mock-data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
