<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人中心 - 番茄小说</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <a class="brand" href="index.html"><div class="brand-badge" aria-hidden="true"></div><div class="brand-text"><strong>番茄小说</strong><small>免费小说阅读</small></div></a>
        <nav class="site-nav" aria-label="主导航"><a href="index.html">首页</a><a href="category.html">分类</a><a href="ranking.html">排行榜</a><a href="bookshelf.html">书架</a></nav>
        <div class="nav-actions"><a href="login.html" class="primary-btn">退出登录</a></div>
      </div>
    </header>
    <main class="container page">
      <div class="page-header"><h1>个人中心</h1><p>管理阅读记录与偏好设置</p></div>
      <div class="profile-layout">
        <section class="panel profile-card">
          <div class="profile-avatar">林</div>
          <h2>林间读者</h2>
          <p>连续阅读 12 天 · 加入番茄 128 天</p>
          <a href="bookshelf.html" class="primary-btn">打开我的书架</a>
          <div class="reading-progress"><span><b>本月阅读时长</b><strong>36.5 小时</strong></span><div class="progress-track"><i style="width:72%"></i></div><small>距离月度目标还有 14 小时</small></div>
        </section>
        <section class="panel preference-panel">
          <div class="section-head"><div><h2>阅读偏好</h2><p>选择你感兴趣的内容与体验</p></div></div>
          <div class="preference-row"><span><b>每日更新提醒</b><small>关注作品有新章节时提醒我</small></span><button class="switch active" aria-label="每日更新提醒"></button></div>
          <div class="preference-row"><span><b>自动加入最近阅读</b><small>在书架中保留最近打开的作品</small></span><button class="switch active" aria-label="自动加入最近阅读"></button></div>
          <div class="preference-row"><span><b>护眼阅读背景</b><small>优先使用柔和的米色背景</small></span><button class="switch" aria-label="护眼阅读背景"></button></div>
          <div class="panel-actions"><a class="secondary-btn" href="about.html">关于平台</a><a class="secondary-btn" href="admin.html">内容管理入口</a></div>
        </section>
      </div>
    </main>
    <script src="assets/app.js"></script>
    <script>
      document.querySelectorAll('.switch').forEach((button) => button.addEventListener('click', () => button.classList.toggle('active')));
    </script>
  </body>
</html>
