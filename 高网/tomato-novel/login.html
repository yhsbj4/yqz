<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 番茄小说</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #fffaf2, #f6f7f9 30%, #f6f7f9 100%);
      }
      .login-wrap {
        width: min(440px, calc(100% - 35px));
        margin: 80px auto 40px;
        padding: 28px 24px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }
      .login-brand { text-align: center; margin-bottom: 20px; }
      .login-brand .brand-badge {
        margin: 0 auto 14px;
        width: 60px; height: 60px; font-size: 1.5rem;
      }
      .login-form { display: flex; flex-direction: column; gap: 16px; }
      .login-form input {
        width: 100%;
        padding: 0.9rem 1rem;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fafbfc;
      }
      .login-footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        color: var(--muted);
        font-size: 0.84rem;
      }
      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-brand">
        <div class="brand-badge" aria-hidden="true"></div>
        <h2 style="margin: 0;">登录番茄小说</h2>
      </div>

      <form class="login-form">
        <input type="text" placeholder="请输入手机号或邮箱" />
        <input type="password" placeholder="请输入密码" />
        <button type="button" class="primary-btn" onclick="location.href='index.html'">立即登录</button>
        <div class="login-footer">
          <label class="check"><input type="checkbox" checked /> 记住我</label>
          <a href="index.html" class="more-link">先逛逛</a>
        </div>
      </form>
    </div>

    <script src="assets/app.js"></script>
  </body>
</html>
