<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分类 - 番茄小说</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <div class="brand">
          <div class="brand-badge" aria-hidden="true"></div>
          <div class="brand-text">
            <strong>番茄小说</strong>
            <small>免费小说阅读</small>
          </div>
        </div>

        <nav class="site-nav" aria-label="主导航">
          <a href="index.html">首页</a>
          <a class="active" href="category.html">分类</a>
          <a href="ranking.html">排行榜</a>
          <a href="bookshelf.html">书架</a>
        </nav>

        <div class="nav-actions">
          <button class="icon-btn" aria-label="搜索">⌕</button>
          <button class="secondary-btn">下载APP</button>
          <a href="login.html" class="primary-btn">登录</a>
        </div>
      </div>
    </header>

    <main class="container page">
      <div class="page-header">
        <h1>小说分类</h1>
      </div>

      <div class="filter-bar">
        <button class="filter-tag active" data-filter="all">全部</button>
        <button class="filter-tag" data-filter="玄幻">玄幻</button>
        <button class="filter-tag" data-filter="都市">都市</button>
        <button class="filter-tag" data-filter="言情">言情</button>
        <button class="filter-tag" data-filter="悬疑">悬疑</button>
        <button class="filter-tag" data-filter="科幻">科幻</button>
        <button class="filter-tag" data-filter="古言">古言</button>
        <button class="filter-tag" data-filter="青春">青春</button>
      </div>

      <div class="search-panel">
        <div class="search-line">
          <input type="text" data-search-input placeholder="搜索小说、作者或题材" />
          <button class="primary-btn">搜索</button>
        </div>
      </div>

      <section>
        <div class="book-grid" id="bookGrid"></div>
      </section>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>
