<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内容管理 - 番茄小说</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <a class="brand" href="index.html"><div class="brand-badge" aria-hidden="true"></div><div class="brand-text"><strong>番茄小说</strong><small>内容管理工作台</small></div></a>
        <nav class="site-nav" aria-label="管理导航"><a href="index.html">阅读站点</a><a class="active" href="admin.html">内容管理</a><a href="about.html">项目说明</a></nav>
        <div class="nav-actions"><a href="login.html" class="secondary-btn">退出管理</a></div>
      </div>
    </header>
    <main class="container page">
      <div class="page-header"><h1>内容管理</h1><p>本地演示数据 · 仅用于课程项目展示</p></div>
      <section class="admin-stats">
        <article class="panel"><small>作品总数</small><strong>1,286</strong><span>本周新增 24 部</span></article>
        <article class="panel"><small>今日阅读</small><strong>86.4 万</strong><span>较昨日 +8.6%</span></article>
        <article class="panel"><small>待审核章节</small><strong>38</strong><span>需要进一步检查</span></article>
        <article class="panel"><small>读者反馈</small><strong>96.8%</strong><span>本月满意度</span></article>
      </section>
      <section class="panel admin-books">
        <div class="section-head"><div><h2>作品目录</h2><p>通过首页 mock 接口读取的本地作品数据</p></div><a href="category.html" class="primary-btn">浏览阅读站</a></div>
        <div class="table-scroll"><table class="admin-table"><thead><tr><th>作品名称</th><th>作者</th><th>分类</th><th>章节</th><th>状态</th></tr></thead><tbody id="adminBookRows"></tbody></table></div>
      </section>
    </main>
    <script src="assets/app.js"></script>
    <script>
      fetch('assets/books.json')
        .then((response) => {
          if (!response.ok) throw new Error(`作品列表加载失败：${response.status}`);
          return response.json();
        })
        .then(({ books }) => {
          document.querySelector('#adminBookRows').innerHTML = books.map((book) => `<tr><td>${book.title}</td><td>${book.author}</td><td>${book.type}</td><td>${book.chapters}</td><td><span class="book-status">${book.status}</span></td></tr>`).join('');
        })
        .catch((error) => {
          console.error(error);
          document.querySelector('#adminBookRows').innerHTML = '<tr><td colspan="5">作品数据暂时无法加载，请检查本地服务。</td></tr>';
        });
    </script>
  </body>
</html>
