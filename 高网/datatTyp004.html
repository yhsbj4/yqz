<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        
    </div>
    <script>
       var a = 10,b = 4;
       console.log(a++);
       console.log(a-b>0?a:b);
       console.log(true&&false,true||false,!true);
       var str = 'hello world',num = 10,ble = true,
       ud,boj={name:'yqz',age:18},arr=[1,2,3,4,5];
       console.log(typeof str,typeof num,typeof ble,typeof ud,typeof boj,typeof arr);
       console.log(0.1+0.2==0.3);
       console.log();

       // ========== 数7游戏 ==========
       var container = document.querySelector('.container');
       for(var i = 1; i <= 100; i++){
           // 判断：是7的倍数 或者 字符串包含"7"
           var s = String(i);
           if(i % 7 === 0 || s.includes('7')){
               console.log('跳过：', i); // 控制台打印被过滤掉的数字
               continue;
           }
           var span = document.createElement('span');
           span.style.display = 'inline-block';
           span.style.padding = '4px 8px';
           span.style.margin = '2px';
           span.innerText = i;
           container.appendChild(span);
       }
    </script>
</body>
</html>
